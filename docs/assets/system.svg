<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5663"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#EC1D25"/>
    </marker>
  </defs>
  <style>
    .box{fill:#181F27;stroke:#2F3A46}
    .t{fill:#E8EBEE;font-size:14px;font-weight:600}
    .s{fill:#95A0AC;font-size:12px}
    .hd{fill:#F0575C;font-size:11px;font-weight:600;letter-spacing:.09em}
    .ln{stroke:#4A5663;stroke-width:1.6;fill:none}
  </style>

  <!-- ЗҮҮН: модель -->
  <rect class="box" x="20" y="215" width="176" height="106" rx="12"/>
  <text class="hd" x="40" y="245">INPUT</text>
  <text class="t" x="40" y="272">Your SketchUp model</text>
  <text class="s" x="40" y="292">generated cabinets</text>
  <text class="s" x="40" y="308">or your own geometry</text>

  <!-- ГОЛ: Panelwright -->
  <rect x="256" y="180" width="240" height="176" rx="14" fill="#1D252E" stroke="#EC1D25" stroke-width="1.5"/>
  <rect x="282" y="206" width="26" height="26" rx="5" fill="#232B36"/>
  <rect x="286" y="211" width="7" height="16" rx="1" fill="#E8EBEE"/>
  <rect x="296" y="211" width="8" height="7" rx="1" fill="#E8EBEE"/>
  <rect x="296" y="220" width="8" height="7" rx="1" fill="#EC1D25"/>
  <text class="t" x="318" y="224" font-family="Archivo, Inter" font-size="19">Panelwright</text>
  <text class="s" x="282" y="256">One calculation reads the model,</text>
  <text class="s" x="282" y="274">applies your databases and shop</text>
  <text class="s" x="282" y="292">standard, and writes every file.</text>
  <text class="s" x="282" y="322" fill="#66717D">Runs inside SketchUp · offline</text>
  <text class="s" x="282" y="338" fill="#66717D">Windows &amp; macOS · 6 languages</text>

  <!-- ДООД: сангууд -->
  <text class="hd" x="256" y="416">YOUR DATA, SET ONCE</text>
  <g>
    <rect class="box" x="256" y="430" width="118" height="76" rx="10"/>
    <text class="t" x="272" y="456" font-size="13">Materials</text>
    <text class="s" x="272" y="474" font-size="11">prices, formats,</text>
    <text class="s" x="272" y="488" font-size="11">grain, edge bands</text>

    <rect class="box" x="386" y="430" width="118" height="76" rx="10"/>
    <text class="t" x="402" y="456" font-size="13">Hardware</text>
    <text class="s" x="402" y="474" font-size="11">Blum · Hettich ·</text>
    <text class="s" x="402" y="488" font-size="11">Häfele · Grass</text>

    <rect class="box" x="516" y="430" width="118" height="76" rx="10"/>
    <text class="t" x="532" y="456" font-size="13">Shop standard</text>
    <text class="s" x="532" y="474" font-size="11">joinery, gaps,</text>
    <text class="s" x="532" y="488" font-size="11">drilling, labour</text>

    <rect class="box" x="646" y="430" width="118" height="76" rx="10"/>
    <text class="t" x="662" y="456" font-size="13">Templates</text>
    <text class="s" x="662" y="474" font-size="11">ready modules,</text>
    <text class="s" x="662" y="488" font-size="11">company, terms</text>
  </g>
  <path class="ln" d="M315 430 L315 400 L376 400 L376 360" marker-end="url(#a)"/>
  <path class="ln" d="M445 430 L445 400 L390 400" />
  <path class="ln" d="M575 430 L575 400 L390 400" />
  <path class="ln" d="M705 430 L705 400 L390 400" />

  <!-- Модель → гол -->
  <path class="ln" d="M196 268 L256 268" marker-end="url(#ar)" stroke="#EC1D25"/>

  <!-- ГОЛООС ГАРАХ -->
  <path class="ln" d="M496 230 L560 230 L560 96" marker-end="url(#a)"/>
  <path class="ln" d="M496 268 L560 268" marker-end="url(#a)"/>
  <path class="ln" d="M496 306 L560 306 L560 400" marker-end="url(#a)" opacity="0"/>

  <!-- БАРУУН: гаралтууд -->
  <rect class="box" x="576" y="20" width="564" height="112" rx="12"/>
  <text class="hd" x="598" y="46">TO THE SHOP FLOOR</text>
  <text class="t" x="598" y="72" font-size="13">Cut list</text>
  <text class="s" x="598" y="90" font-size="11">edge codes</text>
  <text class="t" x="710" y="72" font-size="13">Nesting</text>
  <text class="s" x="710" y="90" font-size="11">+ offcuts</text>
  <text class="t" x="822" y="72" font-size="13">DXF</text>
  <text class="s" x="822" y="90" font-size="11">CNC contours</text>
  <text class="t" x="934" y="72" font-size="13">Drilling</text>
  <text class="s" x="934" y="90" font-size="11">System 32</text>
  <text class="t" x="1046" y="72" font-size="13">Labels</text>
  <text class="s" x="1046" y="90" font-size="11">barcodes</text>
  <line x1="702" y1="58" x2="702" y2="112" stroke="#2F3A46"/>
  <line x1="814" y1="58" x2="814" y2="112" stroke="#2F3A46"/>
  <line x1="926" y1="58" x2="926" y2="112" stroke="#2F3A46"/>
  <line x1="1038" y1="58" x2="1038" y2="112" stroke="#2F3A46"/>

  <rect class="box" x="576" y="152" width="564" height="112" rx="12"/>
  <text class="hd" x="598" y="178">TO THE CLIENT</text>
  <text class="t" x="598" y="204" font-size="13">Quotation</text>
  <text class="s" x="598" y="222" font-size="11">4 layouts</text>
  <text class="t" x="710" y="204" font-size="13">Invoice</text>
  <text class="s" x="710" y="222" font-size="11">IBAN · PO</text>
  <text class="t" x="822" y="204" font-size="13">Contract</text>
  <text class="s" x="822" y="222" font-size="11">PDF + Word</text>
  <text class="t" x="934" y="204" font-size="13">Assembly</text>
  <text class="s" x="934" y="222" font-size="11">per unit</text>
  <text class="t" x="1046" y="204" font-size="13">Shop packet</text>
  <text class="s" x="1046" y="222" font-size="11">on a phone</text>
  <line x1="702" y1="190" x2="702" y2="244" stroke="#2F3A46"/>
  <line x1="814" y1="190" x2="814" y2="244" stroke="#2F3A46"/>
  <line x1="926" y1="190" x2="926" y2="244" stroke="#2F3A46"/>
  <line x1="1038" y1="190" x2="1038" y2="244" stroke="#2F3A46"/>

  <rect class="box" x="576" y="284" width="564" height="112" rx="12"/>
  <text class="hd" x="598" y="310">BACK INTO THE BUSINESS</text>
  <text class="t" x="598" y="336" font-size="13">Stock</text>
  <text class="s" x="598" y="354" font-size="11">deducted</text>
  <text class="t" x="710" y="336" font-size="13">Purchasing</text>
  <text class="s" x="710" y="354" font-size="11">what is short</text>
  <text class="t" x="822" y="336" font-size="13">Offcuts</text>
  <text class="s" x="822" y="354" font-size="11">reused next</text>
  <text class="t" x="934" y="336" font-size="13">Archive</text>
  <text class="s" x="934" y="354" font-size="11">+ Excel</text>
  <text class="t" x="1046" y="336" font-size="13">Profit</text>
  <text class="s" x="1046" y="354" font-size="11">plan vs real</text>
  <line x1="702" y1="322" x2="702" y2="376" stroke="#2F3A46"/>
  <line x1="814" y1="322" x2="814" y2="376" stroke="#2F3A46"/>
  <line x1="926" y1="322" x2="926" y2="376" stroke="#2F3A46"/>
  <line x1="1038" y1="322" x2="1038" y2="376" stroke="#2F3A46"/>

  <path class="ln" d="M496 306 L536 306 L536 340 L576 340" marker-end="url(#a)"/>
  <path class="ln" d="M576 208 L536 208 L536 268 L496 268" opacity="0"/>

  <!-- буцах гогцоо -->
  <path d="M858 396 L858 524 L640 524" stroke="#43A77F" stroke-width="1.6" fill="none" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text x="668" y="544" fill="#43A77F" font-size="12">offcuts, stock levels and real costs feed the next job</text>
</svg>

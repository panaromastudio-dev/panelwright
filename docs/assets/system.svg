  <text class="hd" x="598" y="442">RUN THE BUSINESS</text>
  <text class="t" x="598" y="468" font-size="13">Control center</text>
  <text class="s" x="598" y="486" font-size="11">plans &amp; targets</text>
  <text class="t" x="710" y="468" font-size="13">Reports</text>
  <text class="s" x="710" y="486" font-size="11">monthly, yearly</text>
  <text class="t" x="822" y="468" font-size="13">Pipeline</text>
  <text class="s" x="822" y="486" font-size="11">job statuses</text>
  <text class="t" x="934" y="468" font-size="13">Catalogue</text>
  <text class="s" x="934" y="486" font-size="11">8 PDF templates</text>
  <text class="t" x="1046" y="468" font-size="13">Manual jobs</text>
  <text class="s" x="1046" y="486" font-size="11">add any job</text>
  <line x1="702" y1="454" x2="702" y2="508" stroke="#2F3A46"/>
  <line x1="814" y1="454" x2="814" y2="508" stroke="#2F3A46"/>
  <line x1="926" y1="454" x2="926" y2="508" stroke="#2F3A46"/>
  <line x1="1038" y1="454" x2="1038" y2="508" stroke="#2F3A46"/>
  <path class="ln" d="M540 604 L574 604" marker-end="url(#a)"/>
  <rect class="box" x="576" y="548" width="564" height="112" rx="12"/>
  <text class="hd" x="598" y="574">PROTECTED &amp; SHARED</text>
  <text class="t" x="598" y="600" font-size="13">Backup</text>
  <text class="s" x="598" y="618" font-size="11">one file · auto</text>
  <text class="t" x="710" y="600" font-size="13">Roles</text>
  <text class="s" x="710" y="618" font-size="11">who sees prices</text>
  <text class="t" x="822" y="600" font-size="13">Updates</text>
  <text class="s" x="822" y="618" font-size="11">signed, in-app</text>
  <text class="t" x="934" y="600" font-size="13">Feedback</text>
  <text class="s" x="934" y="618" font-size="11">one-click e-mail</text>
  <text class="t" x="1046" y="600" font-size="13">Team folder</text>
  <text class="s" x="1046" y="618" font-size="11">shared by all</text>
  <line x1="702" y1="586" x2="702" y2="640" stroke="#2F3A46"/>
  <line x1="814" y1="586" x2="814" y2="640" stroke="#2F3A46"/>
  <line x1="926" y1="586" x2="926" y2="640" stroke="#2F3A46"/>
  <line x1="1038" y1="586" x2="1038" y2="640" stroke="#2F3A46"/>

  <!-- feedback loop -->
  <path d="M1140 340 L1152 340 L1152 668 L274 668 L274 586" stroke="#43A77F" stroke-width="1.6" fill="none" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text x="300" y="692" fill="#43A77F" font-size="12">offcuts, stock levels and real costs feed the next job</text>

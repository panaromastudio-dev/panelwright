<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 724" width="1160" height="724" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5663"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#EC1D25"/>
    </marker>
  </defs>
  <style>
    .box{fill:#181F27;stroke:#2F3A46}
    .t{fill:#E8EBEE;font-size:14px;font-weight:600}
    .s{fill:#95A0AC;font-size:12px}
    .hd{fill:#F0575C;font-size:11px;font-weight:600;letter-spacing:.09em}
    .ln{stroke:#4A5663;stroke-width:1.6;fill:none}
  </style>

  <!-- LEFT: model -->
  <rect class="box" x="20" y="285" width="176" height="106" rx="12"/>
  <text class="hd" x="40" y="315">INPUT</text>
  <text class="t" x="40" y="342">Your SketchUp model</text>
  <text class="s" x="40" y="362">generated cabinets</text>
  <text class="s" x="40" y="378">or your own geometry</text>
  <path class="ln" d="M196 338 L256 338" marker-end="url(#ar)" stroke="#EC1D25"/>

  <!-- CENTRE: Panelwright -->
  <rect x="256" y="250" width="240" height="176" rx="14" fill="#1D252E" stroke="#EC1D25" stroke-width="1.5"/>
  <rect x="282" y="276" width="26" height="26" rx="5" fill="#232B36"/>
  <rect x="286" y="281" width="7" height="16" rx="1" fill="#E8EBEE"/>
  <rect x="296" y="281" width="8" height="7" rx="1" fill="#E8EBEE"/>
  <rect x="296" y="290" width="8" height="7" rx="1" fill="#EC1D25"/>
  <text class="t" x="318" y="294" font-family="Archivo, Inter" font-size="19">Panelwright</text>
  <text class="s" x="282" y="326">One calculation reads the model,</text>
  <text class="s" x="282" y="344">applies your databases and shop</text>
  <text class="s" x="282" y="362">standard, and writes every file.</text>
  <text class="s" x="282" y="392" fill="#66717D">Runs inside SketchUp · offline</text>
  <text class="s" x="282" y="408" fill="#66717D">Windows &amp; macOS · 6 languages</text>

  <!-- BOTTOM: databases -->
  <text class="hd" x="20" y="600">YOUR DATA, SET ONCE</text>
  <g>
    <rect class="box" x="20" y="500" width="118" height="76" rx="10"/>
    <text class="t" x="36" y="526" font-size="13">Materials</text>
    <text class="s" x="36" y="544" font-size="11">prices, formats,</text>
    <text class="s" x="36" y="558" font-size="11">grain, banding</text>
    <rect class="box" x="150" y="500" width="118" height="76" rx="10"/>
    <text class="t" x="166" y="526" font-size="13">Hardware</text>
    <text class="s" x="166" y="544" font-size="11">Blum · Hettich ·</text>
    <text class="s" x="166" y="558" font-size="11">Häfele · Grass</text>
    <rect class="box" x="280" y="500" width="118" height="76" rx="10"/>
    <text class="t" x="296" y="526" font-size="13">Shop standard</text>
    <text class="s" x="296" y="544" font-size="11">joinery, gaps,</text>
    <text class="s" x="296" y="558" font-size="11">drilling, labour</text>
    <rect class="box" x="410" y="500" width="118" height="76" rx="10"/>
    <text class="t" x="426" y="526" font-size="13">Templates</text>
    <text class="s" x="426" y="544" font-size="11">145 templates,</text>
    <text class="s" x="426" y="558" font-size="11">company, terms</text>
  </g>
  <path class="ln" d="M79 500 L79 470 L376 470 L376 430" marker-end="url(#a)"/>
  <path class="ln" d="M209 500 L209 470"/>
  <path class="ln" d="M339 500 L339 470"/>
  <path class="ln" d="M469 500 L469 470 L376 470"/>

